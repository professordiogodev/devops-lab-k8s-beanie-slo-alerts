apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu
  namespace: beanie
  labels: {app: menu}
spec:
  replicas: 2
  selector:
    matchLabels: {app: menu}
  template:
    metadata:
      labels: {app: menu}
    spec:
      containers:
        - name: menu
          image: beanie:0.1.0
          args: ["menu"]
          ports:
            - containerPort: 8001
              name: http
          env:
            - {name: CHAOS_ENABLED, value: "true"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8001}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8001}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: menu
  namespace: beanie
spec:
  selector: {app: menu}
  ports:
    - port: 8001
      name: http
      targetPort: 8001
