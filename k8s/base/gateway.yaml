apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: beanie
  labels: {app: gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: beanie:0.1.0
          args: ["gateway"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - {name: MENU_URL, value: "http://menu:8001"}
            - {name: ORDERS_URL, value: "http://orders:8002"}
            - {name: CHAOS_ENABLED, value: "true"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: beanie
spec:
  selector: {app: gateway}
  ports:
    - port: 8000
      name: http
      targetPort: 8000
